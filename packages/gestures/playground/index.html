<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pointy · gesture playground</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; display: grid; grid-template-columns: 360px 1fr; height: 100vh; background: #111; color: #ddd; }
      aside { padding: 12px; overflow-y: auto; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 12px; }
      main { position: relative; }
      #screen { width: 100%; height: 100%; display: block; background: #1b1d22; }
      #cam { width: 100%; border-radius: 8px; background: #000; }
      #status { font-weight: 600; padding: 6px 10px; border-radius: 6px; background: #333; }
      #status.awake { background: #1f6f43; }
      #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; background: #000; padding: 8px; border-radius: 6px; height: 220px; min-height: 220px; overflow-y: auto; overflow-x: hidden; margin: 0; }
      #fps { font: 13px ui-monospace, monospace; color: #aaa; }
      #bridge { font-size: 13px; color: #aaa; }
      label.check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: #aaa; }
      #bridge.on { color: #7CFC9A; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button { background: #2d5bd7; color: white; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
      button.secondary { background: #444; }
      label { display: grid; grid-template-columns: 1fr 80px; font-size: 13px; align-items: center; gap: 6px; }
      input[type="number"] { width: 100%; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 4px; }
      #hint { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 20px; color: #fff; text-shadow: 0 1px 4px #000; }
      h3 { margin: 0; font-size: 14px; color: #aaa; }
    </style>
  </head>
  <body>
    <aside>
      <div id="status">Loading MediaPipe…</div>
      <canvas id="cam" width="640" height="480"></canvas>
      <div class="row">
        <button id="endSession" class="secondary">End session</button>
        <button id="calibrate">Calibrate (4 corners)</button>
        <button id="clear" class="secondary">Clear selection</button>
      </div>
      <label class="check"><input type="checkbox" id="showZone" /> Show active zone (tuning only)</label>
      <div id="fps">— fps · 0 hands</div>
      <div id="bridge">Mouse bridge: off (run <code>npm run mouse-bridge</code>)</div>
      <h3>Events (cursor_moved / dwell_progress hidden)</h3>
      <pre id="log"></pre>
      <h3>Thresholds</h3>
      <div id="params"></div>
    </aside>
    <main>
      <canvas id="screen"></canvas>
      <div id="hint"></div>
    </main>
    <video id="video" playsinline muted style="display: none"></video>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
